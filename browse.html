<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f6f4ef;
      margin: 0;
      padding: 20px 14px 60px;
      color: #2b2b2b;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 2px; }
    .sub { color: #777; font-size: 0.85rem; margin-bottom: 16px; }
    nav a {
      display: inline-block;
      margin-bottom: 16px;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 8px;
      background: #6b4f2b;
      font-weight: 600;
    }
    .searchBar {
      position: sticky;
      top: 0;
      background: #f6f4ef;
      padding: 6px 0 12px;
      z-index: 5;
    }
    #search {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
    }
    .count { font-size: 0.8rem; color: #888; margin-top: 6px; }
    .card {
      background: #fff;
      border: 1px solid #e5ddc9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card h3 { margin: 0 0 2px; font-size: 1.02rem; }
    .card .meta { font-size: 0.82rem; color: #777; margin-bottom: 8px; }
    .card .notes { font-size: 0.8rem; color: #666; font-style: italic; margin-bottom: 8px; }
    .readRow { display: flex; gap: 18px; align-items: center; font-size: 0.85rem; }
    .readRow label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .readRow input { width: 17px; height: 17px; }
    #loading, #empty { text-align: center; color: #999; padding: 30px 0; }
    #empty { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav><a href="?page=entry">+ Add a book</a></nav>
    <h1>Our Home Library</h1>
    <div class="sub">Search by title or author before buying a new one.</div>

    <div class="searchBar">
      <input id="search" type="text" placeholder="Search title or author...">
      <div class="count" id="count"></div>
    </div>

    <div id="loading">Loading books...</div>
    <div id="empty">No books match your search.</div>
    <div id="list"></div>
  </div>

<script>
  let allBooks = [];

  function render(books) {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    document.getElementById('count').textContent = books.length + ' book' + (books.length === 1 ? '' : 's');
    if (books.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    list.innerHTML = books.map(b => `
      <div class="card" data-id="${escapeHtml(b.ID)}">
        <h3>${escapeHtml(b.Title || '(untitled)')}</h3>
        <div class="meta">${escapeHtml(b.Author || 'Unknown author')}${b.Genre ? ' · ' + escapeHtml(b.Genre) : ''}${b['Purchase Date'] ? ' · bought ' + escapeHtml(b['Purchase Date']) : ''}</div>
        ${b.Notes ? '<div class="notes">' + escapeHtml(b.Notes) + '</div>' : ''}
        <div class="readRow">
          <label><input type="checkbox" data-field="Read_Kis" ${b.Read_Kis === true ? 'checked' : ''}> Read by Kis</label>
          <label><input type="checkbox" data-field="Read_Bk" ${b.Read_Bk === true ? 'checked' : ''}> Read by Bk</label>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function applyFilter() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    if (!q) { render(allBooks); return; }
    const filtered = allBooks.filter(b =>
      String(b.Title || '').toLowerCase().includes(q) ||
      String(b.Author || '').toLowerCase().includes(q)
    );
    render(filtered);
  }

  document.getElementById('search').addEventListener('input', applyFilter);

  document.getElementById('list').addEventListener('change', function(e) {
    const target = e.target;
    if (target.tagName !== 'INPUT' || target.type !== 'checkbox') return;
    const card = target.closest('.card');
    const id = card.getAttribute('data-id');
    const field = target.getAttribute('data-field');
    const value = target.checked;
    target.disabled = true;
    google.script.run
      .withSuccessHandler(() => {
        target.disabled = false;
        const b = allBooks.find(x => x.ID === id);
        if (b) b[field] = value;
      })
      .withFailureHandler(err => {
        target.checked = !value;
        target.disabled = false;
        alert('Could not update: ' + err.message);
      })
      .updateReadStatus(id, field, value);
  });

  google.script.run
    .withSuccessHandler(books => {
      allBooks = books;
      document.getElementById('loading').style.display = 'none';
      render(allBooks);
    })
    .withFailureHandler(err => {
      document.getElementById('loading').textContent = 'Error loading books: ' + err.message;
    })
    .getBooks();
</script>
</body>
</html>
